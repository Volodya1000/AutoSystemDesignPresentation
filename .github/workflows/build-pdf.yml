name: Build presentation PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    name: Compile LaTeX presentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Cache TeX Live package archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: texlive-apt-ubuntu-24.04-v1
          restore-keys: |
            texlive-apt-ubuntu-24.04-

      - name: Install LuaLaTeX and required fonts
        run: |
          # Keep downloaded .deb files so actions/cache can save them.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-cyrillic

      - name: Compile PDF
        run: |
          lualatex -interaction=nonstopmode -halt-on-error -file-line-error presentation.tex
          lualatex -interaction=nonstopmode -halt-on-error -file-line-error presentation.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSystemDesignPresentation-pdf
          path: presentation.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit PDF to pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation.pdf
          if git diff --cached --quiet; then
            echo "presentation.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled presentation PDF"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Commit PDF to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation.pdf
          if git diff --cached --quiet; then
            echo "presentation.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled presentation PDF"
          git push
