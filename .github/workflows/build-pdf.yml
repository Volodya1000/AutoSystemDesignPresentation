name: Build presentation PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    name: Compile LaTeX presentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache TeX Live package archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: texlive-apt-ubuntu-24.04-v1
          restore-keys: |
            texlive-apt-ubuntu-24.04-

      - name: Install LuaLaTeX and required fonts
        run: |
          # Keep downloaded .deb files so actions/cache can save them.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-cyrillic

      - name: Compile PDF
        run: |
          lualatex -interaction=nonstopmode -halt-on-error -file-line-error presentation.tex
          lualatex -interaction=nonstopmode -halt-on-error -file-line-error presentation.tex

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: AutoSystemDesignPresentation-pdf
          path: presentation.pdf
          if-no-files-found: error
          retention-days: 30
