name: Build presentation PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    name: Compile LaTeX presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Compile PDF with preinstalled TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: presentation.tex
          latexmk_use_lualatex: true
          extra_system_packages: font-dejavu

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSystemDesignPresentation-pdf
          path: presentation.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit PDF to pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f presentation.pdf
          if git diff --cached --quiet; then
            echo "presentation.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled presentation PDF"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Commit PDF to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f presentation.pdf
          if git diff --cached --quiet; then
            echo "presentation.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled presentation PDF"
          git push
